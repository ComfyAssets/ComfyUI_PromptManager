<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Prompt Manager · Workspace</title>
    <link rel="stylesheet" href="js/shared/toolkit/controls.css">
    <link rel="stylesheet" href="lib/viewerjs/viewer.min.css">
    <link rel="stylesheet" href="js/workspace/concept.css">
    <link rel="stylesheet" href="js/workspace/workspace.css">
    <script src="lib/viewerjs/viewer.min.js" defer></script>
    <script src="js/comfy-metadata.js" defer></script>
    <script src="js/gallery-settings.js" defer></script>
    <script src="js/png-metadata.js" defer></script>
    <script type="module" src="js/workspace/index.mjs"></script>
</head>
<body class="ca-tools">
    <a class="skip" href="#workspace-main">Skip to workspace</a>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="#/images"><span class="brand-mark">P<span>±</span></span><span>Prompt Manager<small>COMFYASSETS</small></span></a>
            <div class="sidebar-label">WORKSPACE</div>
            <nav id="primary-nav" aria-label="Workspace"></nav>
            <!-- D49: the concept's SAVED VIEWS group without its "PROPOSED" badge (saved views are persisted, #249 D16). -->
            <div class="sidebar-label">SAVED VIEWS</div>
            <nav id="saved-nav" aria-label="Saved views"></nav>
            <!-- D136: the concept's COLLECTIONS group without its "PROPOSED" badge; the label shows once a collection is listed. -->
            <div class="sidebar-label" hidden>COLLECTIONS</div>
            <nav id="collections-nav" aria-label="Collections"></nav>
            <div class="sidebar-bottom">
                <nav id="system-nav" aria-label="Tools and system"></nav>
                <div class="connection"><i></i><div>ComfyUI workspace<small>Your library, on your server</small></div></div>
            </div>
        </aside>
        <div class="workspace">
            <header class="topbar">
                <div class="breadcrumbs">ComfyAssets <span>/</span> <span id="workspace-breadcrumb">Images</span></div>
                <div class="top-actions"><!-- D53: the progress pill, shown while a job runs. D52: the count shows running jobs, hidden at 0. --><a id="activity-pill" class="activity-pill" hidden></a><button id="activity-open" type="button">Activity <span class="count" id="activity-count" hidden>0</span></button><label class="theme-label" for="theme">Theme
                        <select id="theme" aria-label="Theme">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                            <option value="system" selected>System</option>
                        </select></label><a class="canvas-link" href="../">ComfyUI <span aria-hidden="true">↗</span></a></div>
            </header>
            <!-- D129: the library-location notice, shown above every page while a node-folder library can move. -->
            <div id="library-banner" class="library-banner" hidden></div>
            <!-- D166: the one-time upgrade notice, shown above every page until dismissed. -->
            <div id="older-images-notice" class="library-banner" hidden></div>
            <main id="workspace-main" tabindex="-1"></main>
            <footer class="app-footer"><span>ComfyAssets · Local tools. Your library.</span></footer>
        </div>
    </div>
    <div id="workspace-toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript><p>This workspace needs JavaScript. <a href="admin">Open the existing dashboard</a>.</p></noscript>
</body>
</html>
